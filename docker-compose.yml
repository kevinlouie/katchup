services:
  katchup:
    build: .
    ports:
      - "8080:8080"
    volumes:
      # Named volume: Docker seeds it from the image, so it is owned by the
      # container's non-root user (uid 100) and works on a fresh clone. To keep
      # the archive in a host directory instead, use a bind mount the container
      # user can write — create it first and either `chown -R 100:101 ./data`,
      # or run as your own user by adding `user: "1000:1000"` (your `id -u`:`id -g`):
      #   - ./data:/app/data
      - katchup_data:/app/data
    environment:
      - DB_PATH=/app/data/katchup.db
      - KATCHUP_LISTEN=:8080
      - KATCHUP_ENV=production
      - KATCHUP_MASTER_KEY=${KATCHUP_MASTER_KEY}
      # Access key for the web UI (/login). Optional: if unset, the UI asks you
      # to create one on first visit and stores its hash in the database.
      - KATCHUP_UI_KEY=${KATCHUP_UI_KEY}
      # Bearer token for the machine-facing /api/* routes. If unset, /api/*
      # fails closed (503). Set it in .env to enable the archived-lookup + sync API.
      - KATCHUP_API_TOKEN=${KATCHUP_API_TOKEN}
      # Header-only search backend. Reachable only on the internal compose network
      # (the meilisearch service publishes no host port). If MEILI_URL is unset,
      # /search degrades to a SQLite LIKE — no hard dependency.
      - MEILI_URL=http://meilisearch:7700
      - MEILI_KEY=${MEILI_MASTER_KEY}
    depends_on:
      - meilisearch
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  meilisearch:
    image: getmeili/meilisearch:v1.10
    # No ports published: search is internal-only, reachable by the katchup
    # service over the default compose network at http://meilisearch:7700.
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7700/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  katchup_data:
  meili_data:
