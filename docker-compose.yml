services:
  katchup:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - DB_PATH=/app/data/katchup.db
      - KATCHUP_LISTEN=:8080
      - KATCHUP_ENV=production
      - KATCHUP_MASTER_KEY=${KATCHUP_MASTER_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
